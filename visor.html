<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Visor 3D</title>

    <script type="module"
        src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js">
    </script>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        .visor {
            width: 100%;
            height: 100%;
            position: relative;
            background: #F5F5F5;
        }

        model-viewer {
            width: 100%;
            height: 100%;
            display: block;
            background: #F5F5F5;
        }

        .titulo {
            position: absolute;
            top: 16px;
            left: 20px;

            font-size: 13px;
            font-weight: 600;

            color: #777;

            pointer-events: none;
            z-index: 10;
        }

        .ayuda {
            position: absolute;
            bottom: 12px;
            left: 0;
            right: 0;

            text-align: center;

            font-size: 12px;
            color: #777;

            pointer-events: none;
            z-index: 10;
        }

    </style>

</head>

<body>

    <div class="visor">

        <div class="titulo">
            VISTA PREVIA 3D
        </div>

        <model-viewer
            src="./ARBOLITO.glb"
            camera-controls
            touch-action="pan-y"
            shadow-intensity="1"
            exposure="1"
            environment-image="neutral"
            interaction-prompt="auto"
            camera-orbit="45deg 70deg 2.5m"
            min-camera-orbit="auto auto 1m"
            max-camera-orbit="auto auto 10m">
        </model-viewer>

        <div class="ayuda">
            Arrastra para rotar · rueda para zoom
        </div>

    </div>

</body>

</html>
