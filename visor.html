<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script type="module"
        src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js">
    </script>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #F5F5F5;
            font-family: Arial, sans-serif;
        }

        model-viewer {
            width: 100%;
            height: 100%;
            background: #F5F5F5;
        }

        .titulo {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 10px 16px;
            background: white;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            box-shadow: 0 3px 15px rgba(0,0,0,.10);
            z-index: 10;
        }

        .ayuda {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 8px 14px;
            background: white;
            border-radius: 10px;
            font-size: 12px;
            color: #777;
            z-index: 10;
            white-space: nowrap;
        }
    </style>
</head>

<body>

    <div class="titulo" id="titulo">
        Vista 3D
    </div>

    <model-viewer
        id="visor"
        camera-controls
        touch-action="pan-y"
        shadow-intensity="1"
        exposure="1"
        environment-image="neutral"
        interaction-prompt="auto">
    </model-viewer>

    <div class="ayuda">
        Arrastra para rotar · rueda para zoom
    </div>

    <script>
        const parametros = new URLSearchParams(window.location.search);

        const modelo = parametros.get("modelo") || "ARBOLITO.glb";
        const nombre = parametros.get("nombre") || "Vista 3D";

        const visor = document.getElementById("visor");
        const titulo = document.getElementById("titulo");

        visor.src =
            "https://forov-99.github.io/PAGINA/" + modelo;

        titulo.textContent = nombre;
    </script>

</body>
</html>
