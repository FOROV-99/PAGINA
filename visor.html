<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Visor 3D · ARQUIESCALA</title>

  <script type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.1.0/model-viewer.min.js">
  </script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      background: #f5f7fa;
      color: #111827;
      font-family: Arial, Helvetica, sans-serif;
    }

    .contenedor {
      width: calc(100% - 60px);
      max-width: 1700px;
      margin: 0 auto;
      padding: 28px 0 35px;
    }

    .marca {
      font-size: 15px;
      color: #64748b;
      letter-spacing: 0.2px;
      margin-bottom: 4px;
    }

    h1 {
      margin: 0 0 28px;
      font-size: 38px;
      line-height: 1.15;
      font-weight: 800;
      color: #111827;
    }

    .visor-contenedor {
      position: relative;
      width: 100%;
      height: 560px;

      background: #ffffff;
      border: 1px solid #dbe3ec;
      border-radius: 22px;

      overflow: hidden;

      box-shadow:
        0 10px 30px rgba(15, 23, 42, 0.05);
    }

    model-viewer {
      width: 100%;
      height: 100%;

      display: block;

      background: #ffffff;

      --poster-color: #ffffff;

      outline: none;
    }

    .cargando {
      position: absolute;
      inset: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #ffffff;

      z-index: 10;

      transition:
        opacity 0.3s ease,
        visibility 0.3s ease;
    }

    .cargando.oculto {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .cargando-contenido {
      text-align: center;
    }

    .spinner {
      width: 38px;
      height: 38px;

      margin: 0 auto 14px;

      border: 4px solid #e2e8f0;
      border-top-color: #111827;

      border-radius: 50%;

      animation: girar 0.8s linear infinite;
    }

    @keyframes girar {
      to {
        transform: rotate(360deg);
      }
    }

    .cargando-texto {
      font-size: 15px;
      color: #64748b;
    }

    .error {
      position: absolute;
      inset: 0;

      display: none;

      align-items: center;
      justify-content: center;

      text-align: center;

      background: #ffffff;

      padding: 30px;
    }

    .error.visible {
      display: flex;
    }

    .error-contenido {
      max-width: 600px;
    }

    .error h2 {
      margin: 0 0 10px;
      font-size: 24px;
    }

    .error p {
      margin: 0;
      color: #64748b;
      line-height: 1.5;
    }

    .instrucciones {
      position: absolute;

      left: 50%;
      bottom: 18px;

      transform: translateX(-50%);

      padding: 10px 16px;

      background: rgba(255, 255, 255, 0.94);

      border: 1px solid #dbe3ec;

      border-radius: 12px;

      font-size: 14px;
      color: #64748b;

      box-shadow:
        0 4px 14px rgba(15, 23, 42, 0.08);

      pointer-events: none;

      z-index: 5;

      white-space: nowrap;
    }

    .parte-inferior {
      display: flex;

      justify-content: space-between;
      align-items: center;

      gap: 20px;

      margin-top: 20px;
    }

    .descripcion {
      color: #64748b;
      font-size: 16px;
    }

    .boton-volver {
      display: inline-flex;
      align-items: center;
      justify-content: center;

      min-width: 180px;
      height: 52px;

      padding: 0 22px;

      border: none;
      border-radius: 14px;

      background: #111827;
      color: #ffffff;

      font-size: 16px;
      font-weight: 700;

      cursor: pointer;

      text-decoration: none;

      transition:
        background 0.2s ease,
        transform 0.2s ease;
    }

    .boton-volver:hover {
      background: #1f2937;
      transform: translateY(-1px);
    }

    .boton-volver:active {
      transform: translateY(0);
    }

    @media (max-width: 800px) {

      .contenedor {
        width: calc(100% - 28px);
        padding-top: 20px;
      }

      h1 {
        font-size: 30px;
        margin-bottom: 20px;
      }

      .visor-contenedor {
        height: 500px;
        border-radius: 16px;
      }

      .instrucciones {
        font-size: 12px;
        padding: 8px 12px;
      }

      .parte-inferior {
        flex-direction: column;
        align-items: stretch;
      }

      .boton-volver {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <main class="contenedor">

    <div class="marca">
      VISOR 3D · ARQUIESCALA
    </div>

    <h1 id="titulo">
      Modelo 3D
    </h1>

    <div class="visor-contenedor">

      <!-- INDICADOR DE CARGA -->
      <div class="cargando" id="cargando">
        <div class="cargando-contenido">
          <div class="spinner"></div>
          <div class="cargando-texto">
            Cargando modelo 3D...
          </div>
        </div>
      </div>

      <!-- MENSAJE DE ERROR -->
      <div class="error" id="error">
        <div class="error-contenido">
          <h2>No se pudo cargar el modelo</h2>
          <p>
            Verifica que el archivo GLB exista y que la dirección
            del modelo sea correcta.
          </p>
        </div>
      </div>

      <!-- VISOR -->
      <model-viewer
        id="visor"
        camera-controls
        touch-action="pan-y"
        interaction-prompt="none"
        loading="eager"
        reveal="auto"
        shadow-intensity="0.35"
        exposure="1"
        environment-image="neutral"
        camera-target="auto"
        camera-orbit="0deg 75deg auto"
        field-of-view="30deg"
        min-field-of-view="20deg"
        max-field-of-view="45deg">
      </model-viewer>

      <div class="instrucciones">
        🖱 Arrastra para rotar · rueda para zoom
      </div>

    </div>

    <div class="parte-inferior">

      <div class="descripcion">
        Modelo 3D interactivo para visualizar antes de realizar tu pedido.
      </div>

      <button
        class="boton-volver"
        id="volverCatalogo">
        Volver al catálogo
      </button>

    </div>

  </main>


  <script>

    /* =========================================================
       OBTENER DATOS DE LA URL
       ========================================================= */

    const parametros = new URLSearchParams(window.location.search);

    const modeloURL = parametros.get("modelo");
    const nombreModelo = parametros.get("nombre");


    /* =========================================================
       ELEMENTOS
       ========================================================= */

    const visor = document.getElementById("visor");
    const titulo = document.getElementById("titulo");

    const cargando = document.getElementById("cargando");
    const error = document.getElementById("error");

    const botonVolver =
      document.getElementById("volverCatalogo");


    /* =========================================================
       NOMBRE DEL MODELO
       ========================================================= */

    if (nombreModelo) {

      titulo.textContent = nombreModelo;

      document.title =
        nombreModelo + " · Visor 3D · ARQUIESCALA";

    }


    /* =========================================================
       CARGAR MODELO
       ========================================================= */

    if (!modeloURL) {

      cargando.classList.add("oculto");
      error.classList.add("visible");

    } else {

      try {

        visor.src = modeloURL;

      } catch (e) {

        cargando.classList.add("oculto");
        error.classList.add("visible");

        console.error(e);

      }

    }


    /* =========================================================
       CUANDO EL MODELO TERMINA DE CARGAR
       ========================================================= */

    visor.addEventListener("load", async () => {

      console.log("Modelo 3D cargado correctamente");

      cargando.classList.add("oculto");

      /*
       * Esperamos un momento para asegurarnos de que
       * model-viewer ya tenga las dimensiones del modelo.
       */

      setTimeout(() => {

        try {

          /*
           * Hace que model-viewer vuelva a calcular
           * automáticamente el encuadre.
           */

          if (typeof visor.updateFraming === "function") {
            visor.updateFraming();
          }

        } catch (e) {

          console.log(
            "No fue necesario actualizar el framing."
          );

        }

        /*
         * Cámara inicial.
         *
         * theta = 0°
         * phi   = 75°
         * radio = auto
         *
         * "auto" permite que model-viewer calcule
         * una distancia adecuada según el tamaño
         * real del GLB.
         */

        visor.setAttribute(
          "camera-orbit",
          "0deg 75deg auto"
        );

      }, 150);

    });


    /* =========================================================
       ERROR AL CARGAR EL MODELO
       ========================================================= */

    visor.addEventListener("error", (evento) => {

      console.error(
        "Error cargando modelo 3D:",
        evento
      );

      cargando.classList.add("oculto");

      error.classList.add("visible");

    });


    /* =========================================================
       ZOOM SUAVE
       ========================================================= */

    let zoomActual = 1;

    const ZOOM_MIN = 0.55;
    const ZOOM_MAX = 1.55;

    let zoomObjetivo = 1;

    let animandoZoom = false;


    /*
     * Interceptamos la rueda del mouse.
     *
     * No dejamos que model-viewer haga su zoom
     * automático porque resulta demasiado agresivo.
     */

    visor.addEventListener(
      "wheel",
      function(evento) {

        evento.preventDefault();

        /*
         * deltaY positivo = alejamiento
         * deltaY negativo = acercamiento
         */

        const direccion =
          evento.deltaY > 0 ? 1 : -1;

        /*
         * Paso MUY pequeño.
         */

        zoomObjetivo += direccion * 0.025;

        /*
         * Limitar zoom.
         */

        zoomObjetivo = Math.max(
          ZOOM_MIN,
          Math.min(ZOOM_MAX, zoomObjetivo)
        );

        iniciarAnimacionZoom();

      },
      {
        passive: false
      }
    );


    /* =========================================================
       ANIMACIÓN DEL ZOOM
       ========================================================= */

    function iniciarAnimacionZoom() {

      if (animandoZoom) {
        return;
      }

      animandoZoom = true;

      function animar() {

        const diferencia =
          zoomObjetivo - zoomActual;

        /*
         * Interpolación suave.
         *
         * Cuanto menor sea el número,
         * más suave será el movimiento.
         */

        zoomActual += diferencia * 0.12;

        if (Math.abs(diferencia) < 0.001) {

          zoomActual = zoomObjetivo;

          aplicarZoom();

          animandoZoom = false;

          return;

        }

        aplicarZoom();

        requestAnimationFrame(animar);

      }

      requestAnimationFrame(animar);

    }


    /* =========================================================
       APLICAR ZOOM
       ========================================================= */

    function aplicarZoom() {

      /*
       * Cambiamos el field-of-view.
       *
       * Menor FOV = acercamiento.
       * Mayor FOV = alejamiento.
       */

      const fovMin = 24;
      const fovMax = 38;

      const fov =
        fovMax -
        ((zoomActual - ZOOM_MIN) /
        (ZOOM_MAX - ZOOM_MIN)) *
        (fovMax - fovMin);

      visor.setAttribute(
        "field-of-view",
        fov.toFixed(2) + "deg"
      );

    }


    /* =========================================================
       DOBLE CLICK
       ========================================================= */

    visor.addEventListener(
      "dblclick",
      function() {

        zoomObjetivo = 1;

        iniciarAnimacionZoom();

      }
    );


    /* =========================================================
       VOLVER AL CATÁLOGO
       ========================================================= */

    botonVolver.addEventListener(
      "click",
      function() {

        /*
         * IMPORTANTE:
         *
         * NO borramos localStorage.
         *
         * El carrito/pedido queda intacto.
         */

        window.location.href = "index.html";

      }
    );


    /* =========================================================
       INICIALIZAR ZOOM
       ========================================================= */

    aplicarZoom();

  </script>

</body>
</html>
