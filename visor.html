<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>ARQUIESCALA — Modelo 3D</title>

<script
    type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.1.0/model-viewer.min.js">
</script>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    background:#ffffff;
    color:#111827;
    font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

.page{
    min-height:100vh;
    display:flex;
    flex-direction:column;
}

.header{
    height:72px;
    padding:0 24px;
    border-bottom:1px solid #e5e7eb;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.brand{
    font-size:21px;
    font-weight:800;
}

.brand span{
    font-weight:400;
    color:#64748b;
}

.back{
    background:#fff;
    border:1px solid #cbd5e1;
    border-radius:9px;
    padding:10px 15px;
    font-weight:700;
    cursor:pointer;
}

.back:hover{
    background:#f8fafc;
}

.main{
    flex:1;
    width:min(1100px,100%);
    margin:auto;
    padding:30px 20px 50px;
}

.title{
    margin-bottom:20px;
}

.title .muted{
    color:#64748b;
    font-size:13px;
    margin-bottom:5px;
}

.title h1{
    margin:0;
    font-size:32px;
    letter-spacing:-1px;
}

.viewer{
    width:100%;
    height:min(72vh,700px);
    min-height:500px;
    border:1px solid #e2e8f0;
    border-radius:20px;
    background:
        linear-gradient(
            145deg,
            #f8fafc,
            #ffffff
        );
    position:relative;
    overflow:hidden;
}

.viewer model-viewer{
    width:100%;
    height:100%;
    display:block;

    --poster-color:transparent;
    --progress-bar-color:transparent;
}

.hint{
    position:absolute;
    bottom:15px;
    right:18px;
    padding:7px 10px;
    border-radius:8px;
    background:rgba(255,255,255,.88);
    border:1px solid #e2e8f0;
    color:#64748b;
    font-size:12px;
    pointer-events:none;
}

.loading{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#64748b;
    font-size:13px;
    pointer-events:none;
}

.footer{
    border-top:1px solid #e5e7eb;
    padding:20px;
    text-align:center;
    color:#64748b;
    font-size:12px;
}

@media(max-width:700px){

    .header{
        padding:0 15px;
    }

    .main{
        padding:20px 12px 35px;
    }

    .title h1{
        font-size:26px;
    }

    .viewer{
        min-height:450px;
        height:65vh;
    }

}

</style>

</head>

<body>

<div class="page">

<header class="header">

<div class="brand">
ARQUIESCALA <span>maquetas</span>
</div>

<button
class="back"
id="back">

← Volver al catálogo

</button>

</header>


<main class="main">

<div class="title">

<div class="muted">
VISTA PREVIA 3D
</div>

<h1 id="model-name">
Modelo 3D
</h1>

</div>


<div class="viewer">

<div
class="loading"
id="loading">

Cargando modelo 3D...

</div>


<model-viewer
id="model"
camera-controls
touch-action="pan-y"
interaction-prompt="auto"
shadow-intensity="0.8"
exposure="1"
loading="eager"
reveal="auto"
bounds="tight"
camera-orbit="0deg 75deg auto"
camera-target="auto auto auto"
field-of-view="35deg"
min-camera-orbit="auto auto 60%"
max-camera-orbit="auto auto 140%"
zoom-sensitivity="0.18"
alt="Modelo 3D">
</model-viewer>


<div class="hint">
Arrastra para rotar · rueda para zoom
</div>

</div>

</main>


<footer class="footer">

© 2026 ARQUIESCALA · Modelos 3D para maquetas arquitectónicas

</footer>

</div>


<script>

const params =
new URLSearchParams(
window.location.search
);


const modelURL =
params.get("modelo");


const modelName =
params.get("nombre");


const model =
document.getElementById(
"model"
);


const nameElement =
document.getElementById(
"model-name"
);


const loading =
document.getElementById(
"loading"
);


if(modelName){

nameElement.textContent =
modelName;

}


if(modelURL){

model.src =
modelURL;

}else{

loading.textContent =
"No se encontró el modelo 3D.";

}


function frameModel(){

if(!model.loaded){
return;
}

try{

const dimensions =
model.getDimensions();

const center =
model.getBoundingBoxCenter();


const largestDimension =
Math.max(
dimensions.x,
dimensions.y,
dimensions.z
);


const fov =
35 * Math.PI / 180;


const distance =
(
largestDimension /
(
2 *
Math.tan(fov / 2)
)
) * 1.20;


model.cameraTarget =
`${center.x}m ${center.y}m ${center.z}m`;


model.cameraOrbit =
`0deg 75deg ${Math.max(distance,.01)}m`;


model.fieldOfView =
"35deg";


model.jumpCameraToGoal();


}catch(error){

console.log(
"Error ajustando cámara:",
error
);

}

}


model.addEventListener(
"load",
() => {

loading.style.display =
"none";

frameModel();

}
);


document
.getElementById("back")
.addEventListener(
"click",
() => {

window.location.href =
"index.html";

}
);


</script>

</body>

</html>
