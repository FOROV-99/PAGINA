<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Visor 3D · ARQUIESCALA</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
background:#f8fafc;
color:#0f172a;
}

.page{
width:100%;
max-width:1500px;
margin:0 auto;
padding:34px 30px 28px;
}

.top-label{
font-size:14px;
color:#64748b;
margin-bottom:8px;
}

h1{
font-size:38px;
line-height:1.1;
margin:0 0 28px;
font-weight:800;
letter-spacing:-1.2px;
}

.viewer-wrap{
width:100%;
height:640px;
background:#fff;
border:1px solid #dbe3ec;
border-radius:22px;
overflow:hidden;
position:relative;
box-shadow:0 10px 30px rgba(15,23,42,.06);
}

model-viewer{
width:100%;
height:100%;
display:block;

background:
radial-gradient(
circle at 50% 45%,
#ffffff 0%,
#f8fafc 65%,
#f1f5f9 100%
);

--poster-color:#ffffff;

touch-action:none;

cursor:grab;
}

model-viewer:active{
cursor:grabbing;
}

.viewer-label{
position:absolute;
top:16px;
left:16px;

background:rgba(255,255,255,.94);

border:1px solid #e2e8f0;

padding:9px 14px;

border-radius:10px;

font-size:13px;

font-weight:700;

color:#334155;

z-index:5;

box-shadow:0 4px 12px rgba(15,23,42,.08);
}

.hint{
position:absolute;
bottom:18px;
left:50%;
transform:translateX(-50%);

background:rgba(255,255,255,.95);

border:1px solid #e2e8f0;

padding:10px 16px;

border-radius:10px;

font-size:13px;

color:#64748b;

z-index:5;

white-space:nowrap;

box-shadow:0 4px 12px rgba(15,23,42,.08);
}

.error{
position:absolute;
inset:0;

display:none;

align-items:center;
justify-content:center;

flex-direction:column;

text-align:center;

padding:30px;

background:#f8fafc;

z-index:10;
}

.error.show{
display:flex;
}

.error h2{
margin:0 0 10px;
font-size:24px;
}

.error p{
margin:0;
color:#64748b;
max-width:520px;
line-height:1.6;
}

.bottom{
display:flex;
justify-content:space-between;
align-items:center;

gap:20px;

margin-top:24px;
}

.description{
font-size:15px;
color:#64748b;
}

.back{
border:0;

background:#111827;

color:#fff;

padding:14px 22px;

border-radius:11px;

font-size:15px;

font-weight:700;

cursor:pointer;

transition:.15s;
}

.back:hover{
background:#1f2937;
transform:translateY(-1px);
}

@media(max-width:800px){

.page{
padding:22px 16px;
}

h1{
font-size:31px;
}

.viewer-wrap{
height:520px;
border-radius:16px;
}

.bottom{
flex-direction:column;
align-items:stretch;
}

.back{
width:100%;
}

.hint{
font-size:11px;
padding:8px 11px;
}

}

</style>

</head>

<body>

<div class="page">

<div class="top-label">
VISOR 3D · ARQUIESCALA
</div>

<h1 id="title">
Cargando modelo...
</h1>

<div class="viewer-wrap">

<div class="viewer-label" id="viewerLabel">
Vista 3D
</div>

<model-viewer
id="modelViewer"

camera-controls
touch-action="none"

interaction-prompt="auto"

shadow-intensity="0.8"
shadow-softness="0.8"

exposure="1"

environment-image="neutral"

camera-orbit="0deg 75deg auto"

field-of-view="45deg"

min-field-of-view="25deg"
max-field-of-view="60deg"

loading="eager"
reveal="auto"

alt="Modelo 3D de ARQUIESCALA">
</model-viewer>

<div class="hint">
🖱 Arrastra para rotar · rueda para zoom
</div>

<div class="error" id="error">

<h2>No se pudo cargar el modelo</h2>

<p id="errorText">
Verifica que el archivo GLB exista en el repositorio.
</p>

</div>

</div>

<div class="bottom">

<div class="description">
Modelo 3D interactivo para visualizar antes de realizar tu pedido.
</div>

<button class="back" id="back">
Volver al catálogo
</button>

</div>

</div>


<script type="module"
src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js">
</script>


<script>

(function(){

const params = new URLSearchParams(window.location.search);

const modelParameter = params.get("modelo");
const nameParameter = params.get("nombre");

const viewer = document.getElementById("modelViewer");
const title = document.getElementById("title");
const viewerLabel = document.getElementById("viewerLabel");

const error = document.getElementById("error");
const errorText = document.getElementById("errorText");

const back = document.getElementById("back");


/* =========================================================
   NOMBRE DEL PRODUCTO
========================================================= */

let productName = nameParameter || "Modelo 3D";

try{

if(productName){
productName = decodeURIComponent(productName);
}

}catch(e){}


/* =========================================================
   MOSTRAR NOMBRE
========================================================= */

title.textContent = productName;

viewerLabel.textContent = productName + " · Vista 3D";


/* =========================================================
   OBTENER URL DEL MODELO
========================================================= */

let modelURL = modelParameter;

try{

if(modelURL){
modelURL = decodeURIComponent(modelURL);
}

}catch(e){}


/* =========================================================
   CONVERTIR URL SI ES NECESARIO
========================================================= */

if(modelURL){

/*
Si viene una URL de GitHub tipo:

https://github.com/USUARIO/REPO/blob/main/ARCHIVO.glb

la convertimos automáticamente a raw.githubusercontent.com
*/

if(modelURL.includes("github.com") && modelURL.includes("/blob/")){

modelURL = modelURL
.replace(
"https://github.com/",
"https://raw.githubusercontent.com/"
)
.replace("/blob/","/");

}


/*
Si viene desde jsDelivr la dejamos intacta.
*/

}


/* =========================================================
   CARGAR MODELO
========================================================= */

function loadModel(){

if(!modelURL){

showError(
"No se recibió ninguna dirección de modelo 3D."
);

return;

}


/*
IMPORTANTE:

No usamos fetch().
No hacemos ninguna comprobación previa.

model-viewer carga directamente el GLB.
*/

viewer.setAttribute(
"src",
modelURL
);

}


/* =========================================================
   MODELO CARGADO
========================================================= */

viewer.addEventListener(
"load",
function(){

error.classList.remove("show");

/*
Reencuadrar automáticamente el modelo
*/

try{

viewer.cameraOrbit =
"0deg 75deg auto";

}catch(e){}

}
);


/* =========================================================
   ERROR REAL DE CARGA
========================================================= */

viewer.addEventListener(
"error",
function(){

showError(
"No se pudo cargar el archivo GLB. Verifica que el nombre y la ubicación del archivo sean correctos."
);

}
);


/* =========================================================
   FUNCIÓN DE ERROR
========================================================= */

function showError(message){

errorText.textContent = message;

error.classList.add("show");

}


/* =========================================================
   VOLVER AL CATÁLOGO
========================================================= */

back.addEventListener(
"click",
function(){

/*
Volvemos al catálogo SIN borrar localStorage.

El carrito queda guardado.
*/

window.location.href =
"./index.html";

}
);


/* =========================================================
   INICIAR
========================================================= */

loadModel();


})();

</script>

</body>
</html>
