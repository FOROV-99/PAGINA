<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Prueba Visor 3D</title>

    <script
        type="module"
        src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js">
    </script>

    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            background: #eeeeee;
        }

        model-viewer {
            width: 100%;
            height: 100%;
            background: #eeeeee;
        }
    </style>
</head>

<body>

    <model-viewer
        src="./ARBOLITO.glb"
        camera-controls
        auto-rotate
        shadow-intensity="1"
        exposure="1"
        environment-image="neutral"
        alt="Árbol 3D">
    </model-viewer>

</body>
</html>
