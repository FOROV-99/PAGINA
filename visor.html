<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Visor 3D · ARQUIESCALA</title>

  <script type="module"
    src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
  </script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f7f9fc;
      color: #111827;
    }

    .contenedor {
      width: calc(100% - 60px);
      max-width: 1700px;
      margin: 0 auto;
      padding: 32px 0 30px;
    }

    .marca {
      font-size: 15px;
      color: #60738f;
      margin-bottom: 10px;
      letter-spacing: 0.3px;
    }

    h1 {
      margin: 0 0 28px;
      font-size: 38px;
      line-height: 1.1;
      font-weight: 800;
      color: #111827;
    }

    .visor-contenedor {
      position: relative;
      width: 100%;
      height: 570px;
      background: #ffffff;
      border: 1px solid #d8e0eb;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 12px 35px rgba(15, 23, 42, 0.05);
    }

    model-viewer {
      width: 100%;
      height: 100%;
      display: block;
      background: #ffffff;

      --poster-color: #ffffff;

      --progress-bar-color: #111827;
      --progress-mask: #ffffff;

      --interaction-prompt-color: #111827;
    }

    .cargando {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 12px;
      background: #ffffff;
      z-index: 5;
      color: #111827;
      font-size: 18px;
      font-weight: 700;
    }

    .cargando small {
      font-size: 14px;
      font-weight: 400;
      color: #60738f;
    }

    .error {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      text-align: center;
      padding: 30px;
      background: #ffffff;
      z-index: 6;
    }

    .error-titulo {
      font-size: 23px;
      font-weight: 800;
      margin-bottom: 10px;
    }

    .error-texto {
      max-width: 750px;
      color: #60738f;
      line-height: 1.6;
      font-size: 15px;
    }

    .informacion {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-top: 24px;
    }

    .descripcion {
      color: #60738f;
      font-size: 16px;
    }

    .boton-regresar {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 180px;
      height: 52px;
      padding: 0 22px;
      border-radius: 13px;
      background: #111827;
      color: white;
      text-decoration: none;
      font-weight: 700;
      font-size: 16px;
      transition: 0.2s ease;
    }

    .boton-regresar:hover {
      background: #1f2937;
      transform: translateY(-1px);
    }

    @media (max-width: 800px) {

      .contenedor {
        width: calc(100% - 30px);
        padding-top: 22px;
      }

      h1 {
        font-size: 30px;
      }

      .visor-contenedor {
        height: 480px;
        border-radius: 18px;
      }

      .informacion {
        flex-direction: column;
        align-items: stretch;
      }

      .boton-regresar {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <main class="contenedor">

    <div class="marca">
      VISOR 3D · ARQUIESCALA
    </div>

    <h1 id="nombreModelo">
      Modelo 3D
    </h1>

    <div class="visor-contenedor">

      <div class="cargando" id="cargando">
        Cargando modelo 3D...
        <small>Espera un momento</small>
      </div>

      <div class="error" id="error">

        <div class="error-titulo">
          No se pudo cargar el modelo
        </div>

        <div class="error-texto" id="mensajeError">
          Verifica que el archivo GLB exista en el repositorio.
        </div>

      </div>

      <model-viewer
        id="modelo3d"

        camera-controls

        interaction-prompt="auto"

        shadow-intensity="0.8"
        shadow-softness="1"

        exposure="1"

        environment-image="neutral"

        loading="eager"

        reveal="auto"

        disable-pan

        min-camera-orbit="auto auto 0.5m"
        max-camera-orbit="auto auto 20m"

        min-field-of-view="20deg"
        max-field-of-view="70deg"

        camera-target="auto auto auto"

        alt="Modelo 3D">
      </model-viewer>

    </div>

    <div class="informacion">

      <div class="descripcion">
        Modelo 3D interactivo para visualizar antes de realizar tu pedido.
      </div>

      <a
        class="boton-regresar"
        id="volverCatalogo"
        href="index.html">
        Volver al catálogo
      </a>

    </div>

  </main>


  <script>

    /*
      ==========================================================
      ARQUIESCALA
      VISOR 3D
      ==========================================================
    */

    const parametros = new URLSearchParams(window.location.search);

    const modeloParametro = parametros.get("modelo");
    const nombreParametro = parametros.get("nombre");


    /*
      ----------------------------------------------------------
      ELEMENTOS
      ----------------------------------------------------------
    */

    const visor = document.getElementById("modelo3d");

    const nombreModelo =
      document.getElementById("nombreModelo");

    const cargando =
      document.getElementById("cargando");

    const error =
      document.getElementById("error");

    const mensajeError =
      document.getElementById("mensajeError");

    const volverCatalogo =
      document.getElementById("volverCatalogo");


    /*
      ----------------------------------------------------------
      NOMBRE DEL MODELO
      ----------------------------------------------------------
    */

    if (nombreParametro) {

      nombreModelo.textContent =
        decodeURIComponent(nombreParametro);

    }


    /*
      ----------------------------------------------------------
      MANTENER EL PEDIDO
      ----------------------------------------------------------
    */

    volverCatalogo.addEventListener("click", function () {

      /*
        No eliminamos localStorage.

        El pedido permanece guardado.
      */

      sessionStorage.setItem(
        "regresoDesdeVisor",
        "true"
      );

    });


    /*
      ----------------------------------------------------------
      CONVERTIR URL A FORMATO SEGURO
      ----------------------------------------------------------
    */

    function limpiarURL(url) {

      if (!url) {
        return "";
      }

      let resultado = url.trim();

      /*
        En caso de que la URL haya quedado
        codificada más de una vez.
      */

      try {

        resultado =
          decodeURIComponent(resultado);

      } catch (e) {

        /*
          Si ya estaba correctamente decodificada,
          simplemente continuamos.
        */

      }

      return resultado;

    }


    /*
      ----------------------------------------------------------
      GENERAR URLS ALTERNATIVAS
      ----------------------------------------------------------
    */

    function obtenerURLs(modelo) {

      const urls = [];

      const urlPrincipal =
        limpiarURL(modelo);

      if (urlPrincipal) {

        urls.push(urlPrincipal);

      }


      /*
        --------------------------------------------------------
        RESPALDO PARA ARCHIVOS DEL REPOSITORIO
        --------------------------------------------------------
      */

      const nombre =
        (nombreParametro || "").toLowerCase();


      /*
        PERSONA
      */

      if (
        nombre.includes("persona") ||
        urlPrincipal.toLowerCase().includes("persona.glb")
      ) {

        urls.push(
          "https://cdn.jsdelivr.net/gh/FOROV-99/PAGINA@main/PERSONA.glb"
        );

        urls.push(
          "https://raw.githubusercontent.com/FOROV-99/PAGINA/main/PERSONA.glb"
        );

      }


      /*
        ARBOL
      */

      if (
        nombre.includes("árbol") ||
        nombre.includes("arbol") ||
        urlPrincipal.toLowerCase().includes("arbolito.glb")
      ) {

        urls.push(
          "https://cdn.jsdelivr.net/gh/FOROV-99/PAGINA@main/ARBOLITO.glb"
        );

        urls.push(
          "https://raw.githubusercontent.com/FOROV-99/PAGINA/main/ARBOLITO.glb"
        );

      }


      /*
        ELIMINAR URLS REPETIDAS
      */

      return [...new Set(urls)];

    }


    /*
      ----------------------------------------------------------
      MOSTRAR ERROR
      ----------------------------------------------------------
    */

    function mostrarError(urls) {

      cargando.style.display = "none";

      error.style.display = "flex";

      mensajeError.innerHTML =

        "El visor intentó cargar el modelo pero el archivo " +
        "no pudo ser obtenido.<br><br>" +

        "<strong>Archivo solicitado:</strong><br>" +

        (urls[0] || "No se recibió ninguna URL.");

    }


    /*
      ----------------------------------------------------------
      CARGAR MODELO
      ----------------------------------------------------------
    */

    async function cargarModelo() {

      const urls =
        obtenerURLs(modeloParametro);


      /*
        No llegó ningún modelo.
      */

      if (urls.length === 0) {

        mostrarError([
          "No se recibió el parámetro modelo."
        ]);

        return;

      }


      /*
        Esperar a que model-viewer esté disponible.
      */

      try {

        await customElements.whenDefined(
          "model-viewer"
        );

      } catch (e) {

        mostrarError(urls);

        return;

      }


      let indice = 0;


      /*
        --------------------------------------------------------
        FUNCIÓN PARA INTENTAR URL
        --------------------------------------------------------
      */

      function intentarURL() {

        if (indice >= urls.length) {

          mostrarError(urls);

          return;

        }


        const urlActual =
          urls[indice];

        indice++;


        cargando.style.display = "flex";

        error.style.display = "none";


        /*
          Limpiar modelo anterior.
        */

        visor.removeAttribute("src");


        /*
          Pequeño retraso para permitir
          que model-viewer limpie el anterior.
        */

        setTimeout(function () {

          visor.src = urlActual;

        }, 50);

      }


      /*
        --------------------------------------------------------
        MODELO CARGADO CORRECTAMENTE
        --------------------------------------------------------
      */

      visor.addEventListener(
        "load",
        function () {

          cargando.style.display =
            "none";

          error.style.display =
            "none";

        }
      );


      /*
        --------------------------------------------------------
        ERROR DE CARGA
        --------------------------------------------------------
      */

      visor.addEventListener(
        "error",
        function () {

          /*
            Intentar la siguiente URL.
          */

          intentarURL();

        }
      );


      /*
        --------------------------------------------------------
        INICIAR
        --------------------------------------------------------
      */

      intentarURL();

    }


    /*
      ----------------------------------------------------------
      INICIAR VISOR
      ----------------------------------------------------------
    */

    cargarModelo();


  </script>

</body>
</html>
